<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#243b31">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="自由奔放"
  >

  <title>赤坂リストランテ自由奔放｜業務マニュアル</title>

  <link rel="manifest" href="./manifest.webmanifest">

  <link
  rel="icon"
  type="image/png"
  href="./icon.png"
>

<link
  rel="apple-touch J-icon"
  href="./icon.png"
>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 22px;
      background: #243b31;
      color: #fffdf8;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 420px);
    }

    .app-icon {
      width: 132px;
      height: 132px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 18px 42px rgba(0, 0, 0, .28);
    }

    h1 {
      margin: 24px 0 8px;
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;
      font-size: 25px;
      font-weight: 500;
      line-height: 1.55;
    }

    p {
      margin: 0 0 28px;
      color: #d5ddd8;
      line-height: 1.8;
    }

    a {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #c4a86f;
      border-radius: 8px;
      background: #fffaf0;
      color: #243b31;
      font-weight: 700;
      text-decoration: none;
    }

    small {
      display: block;
      margin-top: 18px;
      color: #bfcac4;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main>
    <img
      class="app-icon"
      src="./icon-512.png"
      alt="赤坂リストランテ自由奔放"
    >

    <h1>
      赤坂リストランテ自由奔放<br>
      業務マニュアル
    </h1>

    <p>
      ホーム画面に追加すると、店舗アイコンから開けます。
    </p>

    <a
      href="https://script.google.com/macros/s/AKfycbw-YxeYvfg8QDnn7jLMwMVuFPwHdj9hLXS6wF1FrOM230fKFkR6yOZgmlAraGGy2e_7/exec"
    >
      業務マニュアルを開く
    </a>

    <small>
      iPhoneではSafariの共有ボタンから<br>
      「ホーム画面に追加」を選択してください。
    </small>
  </main>

  <script>
    const manualUrl =
      'https://script.google.com/macros/s/AKfycbw-YxeYvfg8QDnn7jLMwMVuFPwHdj9hLXS6wF1FrOM230fKFkR6yOZgmlAraGGy2e_7/exec';

    const standalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    if (standalone) {
      window.location.replace(manualUrl);
    }
  </script>
</body>
</html>
